name: macOS

env:
  QT_VERSION: 6.8.1
  APP_VERSION: 0.0.3

on:
  workflow_call:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # empty if the secrets are not set: then the app is only signed ad hoc, see .github/macos/README.md
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          tools: tools_cmake
          modules: qtquick3d        # the 3D tree
          cache: true

      - name: Configure and build
        run: |
          set -e
          set -o pipefail
          fail() { echo "::error title=build failed::$(grep -E 'error|Error|undefined|No such|not found' build.log | head -12 | sed 's/%/%25/g' | paste -sd '|' -)"; exit 1; }
          command -v ninja >/dev/null || (export HOMEBREW_NO_AUTO_UPDATE=1; brew install ninja)
          cmake -S gui -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build.log || fail
          cmake --build build 2>&1 | tee -a build.log || fail

      - name: Bundle Qt (macdeployqt) and sign ad hoc
        run: |
          set -e
          macdeployqt build/eduhpx.app -qmldir=gui/qml -verbose=1
          # the QML scan pulls in the Qt SQL drivers (they need PostgreSQL libraries); EduHPX does not use SQL
          rm -rf build/eduhpx.app/Contents/PlugIns/sqldrivers
          codesign --force --deep --sign - --timestamp=none build/eduhpx.app
          codesign --verify --deep --strict build/eduhpx.app

      - name: Sign with Developer ID and notarize (only if the secrets are set)
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -e
          KC=$RUNNER_TEMP/eduhpx.keychain-db
          KCPW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          codesign --force --deep --options runtime --timestamp \
            --entitlements .github/macos/EduHPX.entitlements --sign "$MACOS_SIGN_IDENTITY" build/eduhpx.app
          codesign --verify --deep --strict --verbose=2 build/eduhpx.app
          ditto -c -k --keepParent build/eduhpx.app $RUNNER_TEMP/notarize.zip
          xcrun notarytool submit $RUNNER_TEMP/notarize.zip --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD" --wait
          xcrun stapler staple build/eduhpx.app

      - name: Create the DMG (app, examples, link to Applications)
        run: |
          set -e
          mkdir -p dmgroot/examples
          cp -R build/eduhpx.app dmgroot/EduHPX.app
          cp examples/*.csv examples/README.md dmgroot/examples/
          cp LICENSE THIRD_PARTY_NOTICES.md dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "EduHPX_${APP_VERSION}" -srcfolder dmgroot -ov -format UDZO EduHPX_${APP_VERSION}.dmg
          ls -l EduHPX_${APP_VERSION}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduHPX-macOS
          path: EduHPX_${{ env.APP_VERSION }}.dmg
