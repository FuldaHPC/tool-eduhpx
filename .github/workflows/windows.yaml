name: Windows

env:
  QT_VERSION: 6.8.1
  APP_VERSION: 0.0.3

on:
  workflow_call:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310 tools_cmake tools_ninja'
          modules: 'qtquick3d qtshadertools'      # the 3D tree
          cache: true

      - name: Configure and build
        run: |
          cmake -G "Ninja" -S gui -B windows-build -DCMAKE_BUILD_TYPE=Release -DEDUHPX_REQUIRE_QUICK3D=ON 2>&1 | Tee-Object -FilePath build.log
          $rc = $LASTEXITCODE
          if ($rc -eq 0) { cmake --build windows-build 2>&1 | Tee-Object -FilePath build.log -Append; $rc = $LASTEXITCODE }
          if ($rc -ne 0) {
            $m = (Select-String -Path build.log -Pattern 'error|Error|undefined|No such|not found' | Select-Object -First 12 | ForEach-Object { $_.Line.Replace('%','%25') }) -join '|'
            Write-Output "::error title=build failed::$m"
            exit 1
          }

      - name: Collect the program, Qt and the examples (windeployqt)
        run: |
          $out = windeployqt --qmldir gui/qml --dir release windows-build/eduhpx.exe 2>&1 | ForEach-Object { "$_" }
          $rc = $LASTEXITCODE
          $out | Write-Output
          if ($rc -ne 0) {
            $m = ($out | Select-Object -First 8 | ForEach-Object { $_.Replace('%','%25') }) -join '|'
            Write-Output "::error title=windeployqt failed::$m"
            exit 1
          }
          move windows-build/eduhpx.exe release\
          mkdir release\examples
          copy examples\*.csv release\examples\
          copy examples\README.md release\examples\
          copy LICENSE release\
          copy THIRD_PARTY_NOTICES.md release\

      - name: Zip
        run: Compress-Archive -Path release\* -DestinationPath EduHPX_${{ env.APP_VERSION }}-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduHPX-Windows
          path: EduHPX_${{ env.APP_VERSION }}-windows.zip
